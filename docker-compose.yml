services:
  fuseki:
    build:
      context: ./docker/fuseki
      args:
        JENA_VERSION: "6.0.0"
    ports:
      - "3030:3030"
    environment:
      JAVA_OPTIONS: "-Xmx2048m -Xms2048m"
    volumes:
      - fuseki-data:/fuseki/databases
      - ./docker/fuseki/config.ttl:/fuseki/config.ttl:ro
    command: ["--conf", "config.ttl"]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fuseki-data:
  elasticsearch-data:
